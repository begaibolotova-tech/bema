<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 1920, H = 1080;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
const add = (p, d) => [p[0] + d[0], p[1] + d[1]];
const rot = (p, a) => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a)];
// keyframes: [[t, [x,y]], ...] eased between
function kf(t, frames) {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 0; i < frames.length - 1; i++) {
    const [t0, v0] = frames[i], [t1, v1] = frames[i + 1];
    if (t <= t1) return lerp2(v0, v1, seg(t, t0, t1));
  }
  return frames[frames.length - 1][1];
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
// seeded random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const dust = Array.from({ length: 45 }, () => ({ x: rnd(), y: rnd(), r: 1.5 + rnd() * 3, s: .3 + rnd() * .7, p: rnd() * 6 }));
const hearts = Array.from({ length: 11 }, (_, i) => ({ x: 900 + rnd() * 260, d: 7.5 + i * .17, s: .6 + rnd() * .7, w: rnd() * 6, c: ['#ff5d7a', '#ff8fa3', '#ffb703', '#ff6f91'][i % 4] }));

// ---------- palette ----------
const P = {
  wall: '#f6dcab', wall2: '#eec98a', lattice: '#c4884a', roof: '#efc078', pole: '#b2472f', wood: '#7a3e1d',
  red: '#b3262e', gold: '#f2b632', rug: '#b8322b', floor: '#6e3420',
  skinK: '#f3c39c', skinA: '#e4ab84', ink: '#3b2416', blush: 'rgba(240,110,110,.45)',
};

// ---------- background ----------
function horn(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = 'round';
  for (const m of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(0, 0);
    ctx.bezierCurveTo(0, -32, 42 * m, -38, 42 * m, -10);
    ctx.bezierCurveTo(42 * m, 6, 22 * m, 8, 21 * m, -5);
    ctx.stroke();
  }
  ctx.restore();
}
function flowerMedallion(x, y, r) {
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ellipse(x + Math.cos(a) * r * .55, y + Math.sin(a) * r * .55, r * .32, r * .32, i % 2 ? '#f2b632' : '#2a7f8f');
  }
  circle(x, y, r * .35, '#fff3d6'); circle(x, y, r * .16, '#b3262e');
}
function komuz(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  rrect(-10, -230, 20, 200, 8); ctx.fillStyle = '#6b3415'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 40, 62, 90, 0, 0, Math.PI * 2); ctx.fillStyle = '#9b5523'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 45, 44, 68, 0, 0, Math.PI * 2); ctx.fillStyle = '#c47a3a'; ctx.fill();
  ctx.strokeStyle = '#fff1d0'; ctx.lineWidth = 1.5;
  for (const dx of [-6, 0, 6]) { ctx.beginPath(); ctx.moveTo(dx, -225); ctx.lineTo(dx, 110); ctx.stroke(); }
  for (const py of [-215, -190, -165]) circle(-14, py, 5, '#3d1d0a');
  ctx.restore();
}
function background(t) {
  // wall
  const g = ctx.createLinearGradient(0, 300, 0, 800);
  g.addColorStop(0, P.wall); g.addColorStop(1, P.wall2);
  ctx.fillStyle = g; ctx.fillRect(0, 280, W, 540);
  // kerege lattice
  ctx.save(); ctx.beginPath(); ctx.rect(0, 300, W, 500); ctx.clip();
  ctx.strokeStyle = P.lattice; ctx.globalAlpha = .55; ctx.lineWidth = 8;
  for (let x = -600; x < W + 600; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 300); ctx.lineTo(x + 500, 800); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, 300); ctx.lineTo(x - 500, 800); ctx.stroke();
  }
  ctx.globalAlpha = .7;
  for (let x = -600; x < W + 600; x += 80) for (let k = 0; k < 13; k++) {
    const yy = 300 + k * 40, xx = x + (k % 2) * 40; circle(xx, yy, 5, '#8d5527');
  }
  ctx.restore();
  // roof
  ctx.fillStyle = P.roof; ctx.fillRect(0, 0, W, 300);
  ctx.strokeStyle = P.pole; ctx.lineWidth = 13; ctx.lineCap = 'round';
  for (let x = -300; x <= W + 300; x += 105) {
    ctx.beginPath(); ctx.moveTo(960 + (x - 960) * .18, 120); ctx.lineTo(x, 300); ctx.stroke();
  }
  // tunduk
  const sky = ctx.createRadialGradient(960, 0, 20, 960, 0, 230);
  sky.addColorStop(0, '#d9f3ff'); sky.addColorStop(1, '#7cc6ec');
  circle(960, -30, 215, P.wood); circle(960, -30, 195, sky);
  ctx.strokeStyle = P.wood; ctx.lineWidth = 12;
  for (const m of [-1, 1]) for (const o of [-60, 0, 60]) {
    ctx.beginPath(); ctx.ellipse(960 + m * 330 + o * m * -1, -30, 300, 300, 0, Math.PI * (m > 0 ? .78 : -.22), Math.PI * (m > 0 ? 1.22 : .22)); ctx.stroke();
  }
  // bakan band
  ctx.fillStyle = P.red; ctx.fillRect(0, 285, W, 34);
  ctx.strokeStyle = P.gold; ctx.lineWidth = 4; ctx.beginPath();
  for (let x = 0; x <= W; x += 30) ctx.lineTo(x, 302 + (x / 30 % 2 ? -9 : 9)); ctx.stroke();
  // tush kiyiz (embroidered hanging) behind kainene
  rrect(1420, 360, 330, 300, 14); ctx.fillStyle = '#8f1d2a'; ctx.fill();
  ctx.lineWidth = 10; ctx.strokeStyle = P.gold; rrect(1436, 376, 298, 268, 10); ctx.stroke();
  flowerMedallion(1585, 510, 70); flowerMedallion(1480, 420, 26); flowerMedallion(1690, 420, 26);
  flowerMedallion(1480, 600, 26); flowerMedallion(1690, 600, 26);
  // komuz on left wall
  komuz(260, 520, -.35);
  // floor + shyrdak rug
  ctx.fillStyle = P.floor; ctx.fillRect(0, 800, W, 280);
  ctx.beginPath(); ctx.moveTo(330, 820); ctx.lineTo(1590, 820); ctx.lineTo(1780, 1080); ctx.lineTo(140, 1080); ctx.closePath();
  ctx.fillStyle = P.rug; ctx.fill();
  ctx.beginPath(); ctx.moveTo(370, 838); ctx.lineTo(1550, 838); ctx.lineTo(1720, 1080); ctx.lineTo(200, 1080); ctx.closePath();
  ctx.lineWidth = 12; ctx.strokeStyle = P.gold; ctx.stroke();
  for (let i = 0; i < 7; i++) horn(420 + i * 180, 1010, 1, '#f6c04d');
  for (let i = 0; i < 8; i++) horn(440 + i * 150, 900, .55, '#2a7f8f');
}
function lightBeam(t) {
  ctx.save();
  const g = ctx.createLinearGradient(0, 120, 0, 1080);
  g.addColorStop(0, `rgba(255,245,200,${.30 + .05 * Math.sin(t * 2)})`); g.addColorStop(1, 'rgba(255,240,190,0)');
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(840, 150); ctx.lineTo(1080, 150); ctx.lineTo(1300, 1080); ctx.lineTo(640, 1080); ctx.closePath(); ctx.fill();
  for (const d of dust) {
    const y = 160 + ((d.y * 900 - t * 25 * d.s) % 900 + 900) % 900;
    const x = 860 + d.x * 200 + (y - 150) * .2 * (d.x - .5) + Math.sin(t * d.s + d.p) * 12;
    ctx.globalAlpha = .5 + .4 * Math.sin(t * 3 + d.p);
    circle(x, y, d.r, '#fff7da');
  }
  ctx.restore();
}

// ---------- props ----------
function piala(x, y, fill, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-34, -22); ctx.quadraticCurveTo(-30, 18, 0, 20); ctx.quadraticCurveTo(30, 18, 34, -22); ctx.closePath();
  ctx.fillStyle = '#fbfbff'; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = '#2462c9'; ctx.fillRect(-40, -12, 80, 9);
  for (let i = -3; i <= 3; i++) circle(i * 10, 6, 3, '#2462c9'); ctx.restore();
  ellipse(0, 20, 14, 4, '#d9dbe8');
  ellipse(0, -22, 34, 8, '#e3e6f2');
  if (fill > 0) ellipse(0, -22 + 4 * (1 - fill), 30 * (.75 + .25 * fill), 6.5 * (.75 + .25 * fill), '#b4621e');
  ctx.restore();
}
function steam(x, y, t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${.65 * a})`; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    for (let k = 0; k <= 20; k++) {
      const yy = y - 30 - k * 4.5, xx = x + i * 12 + Math.sin(k * .45 - t * 4 + i) * 7;
      k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
    }
    ctx.stroke();
  }
  ctx.restore();
}
const TEAPOT_SPOUT = [92, -38], TEAPOT_HANDLE = [-78, -8], TEAPOT_LID = [-4, -62];
function teapot(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  // spout
  ctx.beginPath(); ctx.moveTo(40, 0); ctx.quadraticCurveTo(70, -2, 92, -40); ctx.lineTo(100, -36); ctx.quadraticCurveTo(80, 14, 42, 22); ctx.closePath();
  ctx.fillStyle = '#f4f6ff'; ctx.fill();
  // handle
  ctx.beginPath(); ctx.ellipse(-56, -4, 28, 30, 0, Math.PI * .5, Math.PI * 1.5); ctx.lineWidth = 11; ctx.strokeStyle = '#f4f6ff'; ctx.stroke();
  // body
  ellipse(0, 0, 60, 48, '#f8f9ff');
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 60, 48, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#2462c9'; ctx.fillRect(-70, -8, 140, 14);
  for (const fx of [-34, 0, 34]) { circle(fx, 24, 9, '#2462c9'); circle(fx, 24, 4, '#f8f9ff'); }
  ellipse(-18, -22, 22, 10, 'rgba(255,255,255,.8)');
  ctx.restore();
  ellipse(0, -46, 32, 9, '#dfe3f3'); ellipse(0, -50, 22, 10, '#f8f9ff'); circle(0, -62, 7, '#2462c9');
  ctx.restore();
}
function table() {
  ellipse(960, 836, 240, 50, '#5e2e14');
  ctx.fillStyle = '#5e2e14'; ctx.fillRect(760, 836, 26, 34); ctx.fillRect(1134, 836, 26, 34);
  ellipse(960, 820, 240, 50, '#a3582c');
  ellipse(960, 820, 205, 38, '#c9733c');
  ctx.strokeStyle = '#f2c66b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(960, 820, 180, 30, 0, 0, Math.PI * 2); ctx.stroke();
  // bread (nan)
  ellipse(1075, 808, 62, 22, '#c97f35'); ellipse(1075, 805, 46, 15, '#e4a85b');
  for (let i = 0; i < 9; i++) circle(1048 + (i % 3) * 27, 799 + Math.floor(i / 3) * 5, 2.2, '#8a4b17');
  // boorsok plate
  ellipse(990, 840, 66, 17, '#2462c9'); ellipse(990, 838, 58, 13, '#f8f9ff');
  for (let i = 0; i < 10; i++) {
    const bx = 952 + (i % 5) * 19, by = 834 - Math.floor(i / 5) * 12;
    rrect(bx - 9, by - 8, 18, 15, 6); ctx.fillStyle = i % 2 ? '#d98d33' : '#e9a64a'; ctx.fill();
  }
  // candies
  for (const [cx, cy, col] of [[1130, 830, '#e63946'], [1145, 822, '#ffb703'], [1120, 818, '#2a9d8f']]) circle(cx, cy, 7, col);
}

// ---------- characters ----------
function face(hx, hy, look, o) {
  const ex = 22;
  // cheeks
  circle(hx - 30 + look, hy + 22, 13, P.blush); circle(hx + 30 + look, hy + 22, 13, P.blush);
  ctx.strokeStyle = P.ink; ctx.lineCap = 'round';
  // brows
  ctx.lineWidth = 4;
  for (const m of [-1, 1]) { ctx.beginPath(); ctx.arc(hx + m * ex + look, hy - 6, 13, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke(); }
  // eyes
  for (const m of [-1, 1]) {
    const x = hx + m * ex + look, y = hy + 6;
    if (o.happy) {
      ctx.lineWidth = 4.5; ctx.beginPath(); ctx.arc(x, y + 4, 9, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else {
      ctx.save(); ctx.translate(x, y); ctx.scale(1, o.blink);
      ellipse(0, 0, 7.5, 9.5, P.ink); circle(2.5, -3, 2.8, '#fff');
      ctx.restore();
    }
    if (o.old) { ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + m * 13, y + 2); ctx.lineTo(x + m * 19, y - 2); ctx.moveTo(x + m * 13, y + 6); ctx.lineTo(x + m * 19, y + 8); ctx.stroke(); }
  }
  // nose
  ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hx + look + 2, hy + 18, 5, Math.PI * .1, Math.PI * .9); ctx.stroke();
  // mouth
  ctx.beginPath(); ctx.arc(hx + look, hy + 28, 10 + o.smile * 5, Math.PI * .15, Math.PI * .85);
  if (o.smile > .6) { ctx.closePath(); ctx.fillStyle = '#9c3b3b'; ctx.fill(); }
  ctx.lineWidth = 3.5; ctx.stroke();
  if (o.old) { ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx + look, hy + 26, 26, Math.PI * .2, Math.PI * .3); ctx.stroke(); ctx.beginPath(); ctx.arc(hx + look, hy + 26, 26, Math.PI * .7, Math.PI * .8); ctx.stroke(); }
}
function arm(sh, hand, col, skin, sag = 40) {
  const mid = [(sh[0] + hand[0]) / 2, Math.max(sh[1], hand[1]) + sag];
  ctx.strokeStyle = col; ctx.lineWidth = 30; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.quadraticCurveTo(mid[0], mid[1], hand[0], hand[1]); ctx.stroke();
  circle(hand[0], hand[1], 16, skin);
}
function kelinBody(t, cx, lean) {
  const br = Math.sin(t * 2.4) * 2;
  const hx = cx + lean * 1.3, hy = 505 + br + lean * .6;
  // braids behind
  ctx.strokeStyle = '#1d120c'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx - 52, 540); ctx.quadraticCurveTo(hx - 80, 640, hx - 66, 730); ctx.stroke();
  // skirt (kneeling)
  ctx.beginPath(); ctx.moveTo(cx - 130, 845); ctx.quadraticCurveTo(cx - 95, 720, cx - 58 + lean * .5, 690);
  ctx.lineTo(cx + 62 + lean * .5, 690); ctx.quadraticCurveTo(cx + 120, 740, cx + 140, 845); ctx.closePath();
  ctx.fillStyle = '#d8434f'; ctx.fill();
  ctx.fillStyle = P.gold; ctx.fillRect(cx - 132, 828, 274, 12);
  for (let i = 0; i < 9; i++) circle(cx - 110 + i * 28, 810, 5, '#f7a9b4');
  // torso
  rrect(cx - 62 + lean, 590 + br, 124, 125, 40); ctx.fillStyle = '#d8434f'; ctx.fill();
  // vest
  ctx.beginPath(); ctx.moveTo(cx - 60 + lean, 615 + br); ctx.lineTo(cx - 8 + lean, 600 + br); ctx.lineTo(cx - 14 + lean, 720); ctx.lineTo(cx - 66 + lean, 720); ctx.closePath();
  ctx.moveTo(cx + 60 + lean, 615 + br); ctx.lineTo(cx + 8 + lean, 600 + br); ctx.lineTo(cx + 14 + lean, 720); ctx.lineTo(cx + 66 + lean, 720); ctx.closePath();
  ctx.fillStyle = '#1f6f78'; ctx.fill(); ctx.strokeStyle = P.gold; ctx.lineWidth = 4; ctx.stroke();
  // neck
  ctx.fillStyle = P.skinK; ctx.fillRect(hx - 14, hy + 50, 28, 40);
  // scarf back
  circle(hx, hy - 2, 76, '#ffffff');
  ctx.beginPath(); ctx.moveTo(hx - 70, hy + 10); ctx.quadraticCurveTo(hx - 95, hy + 90, hx - 70, hy + 130); ctx.lineTo(hx + 10, hy + 100); ctx.closePath(); ctx.fill();
  // face
  circle(hx, hy + 8, 60, P.skinK);
  // scarf front band
  ctx.save(); ctx.beginPath(); ctx.moveTo(hx - 95, hy - 4); ctx.quadraticCurveTo(hx, hy - 42, hx + 95, hy - 4); ctx.lineTo(hx + 95, hy - 140); ctx.lineTo(hx - 95, hy - 140); ctx.closePath(); ctx.clip();
  circle(hx, hy - 2, 76, '#ffffff'); ctx.restore();
  for (const [dx, dy] of [[-40, -45], [-10, -60], [22, -52], [48, -30], [-55, -15]]) circle(hx + dx, hy + dy, 4, '#f4a3b0');
  // earrings
  circle(hx + 54, hy + 34, 6, P.gold);
  return [hx, hy];
}
function kainenBody(t, cx) {
  const br = Math.sin(t * 2 + 1) * 2;
  const hx = cx, hy = 500 + br;
  // cushion
  rrect(cx - 175, 815, 350, 55, 26); ctx.fillStyle = '#9e1f2b'; ctx.fill();
  ctx.strokeStyle = P.gold; ctx.lineWidth = 5; rrect(cx - 165, 822, 330, 41, 20); ctx.stroke();
  // skirt (sitting)
  ctx.beginPath(); ctx.moveTo(cx - 165, 840); ctx.quadraticCurveTo(cx - 120, 720, cx - 70, 690);
  ctx.lineTo(cx + 70, 690); ctx.quadraticCurveTo(cx + 120, 720, cx + 165, 840); ctx.closePath();
  ctx.fillStyle = '#2f5d50'; ctx.fill();
  // torso
  rrect(cx - 72, 588 + br, 144, 135, 44); ctx.fillStyle = '#2f5d50'; ctx.fill();
  // velvet kemsel
  ctx.beginPath(); ctx.moveTo(cx - 72, 620 + br); ctx.lineTo(cx - 12, 600 + br); ctx.lineTo(cx - 26, 810); ctx.lineTo(cx - 130, 815); ctx.closePath();
  ctx.moveTo(cx + 72, 620 + br); ctx.lineTo(cx + 12, 600 + br); ctx.lineTo(cx + 26, 810); ctx.lineTo(cx + 130, 815); ctx.closePath();
  ctx.fillStyle = '#6a1b3a'; ctx.fill(); ctx.strokeStyle = P.gold; ctx.lineWidth = 5; ctx.stroke();
  for (let i = 0; i < 4; i++) { circle(cx - 40, 660 + i * 38, 5, P.gold); circle(cx + 40, 660 + i * 38, 5, P.gold); }
  // elechek (white turban) back + chin wrap
  circle(hx, hy + 12, 82, '#fbf7ee');
  rrect(hx - 80, hy - 128, 160, 120, 60); ctx.fillStyle = '#fbf7ee'; ctx.fill();
  ctx.strokeStyle = '#e2dccd'; ctx.lineWidth = 4;
  for (const yy of [-100, -75, -50]) { ctx.beginPath(); ctx.moveTo(hx - 72, hy + yy + 12); ctx.quadraticCurveTo(hx, hy + yy - 8, hx + 72, hy + yy + 12); ctx.stroke(); }
  // face
  circle(hx, hy + 6, 58, P.skinA);
  // front band
  ctx.save(); ctx.beginPath(); ctx.moveTo(hx - 95, hy - 10); ctx.quadraticCurveTo(hx, hy - 46, hx + 95, hy - 10); ctx.lineTo(hx + 95, hy - 160); ctx.lineTo(hx - 95, hy - 160); ctx.closePath(); ctx.clip();
  circle(hx, hy + 12, 82, '#fbf7ee'); ctx.restore();
  // gray hair wisp
  ctx.strokeStyle = '#c9c4bd'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(hx - 52, hy - 12); ctx.quadraticCurveTo(hx - 30, hy - 26, hx - 8, hy - 22); ctx.stroke();
  return [hx, hy];
}

// ---------- timeline ----------
const PIALA_TABLE = [985, 800];
function pialaPos(t) {
  return kf(t, [[5.0, PIALA_TABLE], [6.6, [1010, 705]], [7.2, [1010, 705]], [8.3, [1110, 690]]]);
}
function teapotState(t) {
  const pos = kf(t, [[0, [880, 690]], [1.0, [888, 682]], [4.0, [888, 682]], [4.6, [855, 782]]]);
  const a = .62 * (seg(t, 1.0, 1.6) - seg(t, 3.4, 3.95));
  return { pos, a };
}
function captions(t) {
  const lines = [
    [0.2, 2.6, 'Келин — үйдүн куту,'],
    [2.6, 4.9, 'кайнене — үйдүн түркүгү.'],
    [4.9, 7.4, 'Бири-бирин сыйлаган үйгө бакыт консо.'],
    [7.4, 10.5, 'Ынтымак — бакыттын ачкычы!'],
  ];
  ctx.font = 'bold 54px "DejaVu Sans", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const [a, b, s] of lines) {
    const al = clamp((t - a) / .3) * clamp((b - t) / .3);
    if (al <= 0) continue;
    ctx.save(); ctx.globalAlpha = al;
    const w = ctx.measureText(s).width + 80, y = 1000 + (1 - al) * 12;
    rrect(960 - w / 2, y - 46, w, 92, 46); ctx.fillStyle = 'rgba(45,15,10,.62)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(242,182,50,.85)'; ctx.stroke();
    ctx.fillStyle = s.startsWith('Ынтымак') ? '#ffe9a8' : '#ffffff'; ctx.fillText(s, 960, y + 2);
    ctx.restore();
  }
}
function heart(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
  ctx.moveTo(0, 12); ctx.bezierCurveTo(-30, -8, -18, -34, 0, -18); ctx.bezierCurveTo(18, -34, 30, -8, 0, 12);
  ctx.fillStyle = col; ctx.fill(); ctx.restore();
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const z = 1.07 - .07 * ease(clamp(t / 10));
  ctx.setTransform(z, 0, 0, z, 960 * (1 - z), 600 * (1 - z));

  background(t);
  lightBeam(t);

  const lean = 26 * (seg(t, 4.8, 6.4) - seg(t, 7.4, 8.4));
  const kelinX = 755;
  const kainX = 1185;
  const [khx, khy] = kelinBody(t, kelinX, lean);
  const [ahx, ahy] = kainenBody(t, kainX);
  const blink = (tt => { const p = tt % 3.1; return p < .12 ? Math.abs(p - .06) / .06 : 1; })(t + .5);
  face(khx, khy + 8, 8, { blink: Math.max(.08, blink), happy: t > 7.6, smile: t > 7.4 ? .9 : .35 });
  face(ahx, ahy + 6, -8, { old: true, happy: true, smile: t > 7.0 ? 1 : .4 });

  table();

  // tea fill level
  const fill = seg(t, 1.6, 3.5);
  const tp = teapotState(t);
  const handle = add(tp.pos, rot(TEAPOT_HANDLE, tp.a));
  const lid = add(tp.pos, rot(TEAPOT_LID, tp.a));
  const pp = pialaPos(t);

  // teapot drawn (on table once set down, otherwise in hand later)
  teapot(tp.pos[0], tp.pos[1], tp.a);

  // tea stream
  const streamA = seg(t, 1.45, 1.6) * (1 - seg(t, 3.3, 3.45));
  if (streamA > 0) {
    const tip = add(tp.pos, rot(TEAPOT_SPOUT, tp.a));
    ctx.save(); ctx.globalAlpha = streamA; ctx.strokeStyle = '#b4621e'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.quadraticCurveTo(tip[0] + 24, tip[1] + 10, pp[0] + 4, pp[1] - 22); ctx.stroke();
    for (let i = 0; i < 3; i++) circle(pp[0] - 10 + i * 10 + Math.sin(t * 20 + i) * 4, pp[1] - 28 - Math.abs(Math.sin(t * 15 + i * 2)) * 8, 3, '#d38a45');
    ctx.restore();
  }

  piala(pp[0], pp[1], fill);
  steam(pp[0], pp[1], t, seg(t, 3.0, 3.8));

  // kelin arms
  const kShF = [kelinX + 50 + lean, 612], kShB = [kelinX - 40 + lean, 615];
  const lap = [[kelinX + 30, 705], [kelinX + 58, 712]];
  let kh1, kh2;
  if (t < 4.6) { kh1 = handle; kh2 = lid; }
  else {
    const restH = add([855, 782], TEAPOT_HANDLE), restL = add([855, 782], TEAPOT_LID);
    const k1 = seg(t, 4.6, 5.0), k2 = seg(t, 7.3, 8.2);
    kh1 = lerp2(lerp2(restH, add(pp, [-36, 0]), k1), lap[0], k2);
    kh2 = lerp2(lerp2(restL, add(pp, [-8, 20]), k1), lap[1], k2);
  }
  arm(kShB, kh2, '#c23845', P.skinK, 30);
  arm(kShF, kh1, '#d8434f', P.skinK, 40);

  // kainene arms
  const aShF = [kainX - 55, 615], aShB = [kainX + 30, 618];
  const k3 = seg(t, 6.2, 7.0);
  const ah1 = lerp2([kainX - 30, 770], add(pp, [36, 0]), k3);
  const ah2 = lerp2([kainX + 20, 775], add(pp, [10, 20]), k3);
  arm(aShB, ah2, '#244a40', P.skinA, 30);
  arm(aShF, ah1, '#2f5d50', P.skinA, 40);

  // hearts + sparkles
  for (const h of hearts) {
    const lt = t - h.d; if (lt < 0) continue;
    const a = clamp(lt / .3) * clamp((2.4 - lt) / .6);
    ctx.save(); ctx.globalAlpha = a;
    heart(h.x + Math.sin(lt * 3 + h.w) * 18, 640 - lt * 150, h.s * (0.6 + .4 * clamp(lt / .4)), h.c);
    ctx.restore();
  }
  if (t > 7.3) {
    for (let i = 0; i < 8; i++) {
      const ang = i * Math.PI / 4 + t, r = 60 + 20 * Math.sin(t * 3 + i);
      ctx.save(); ctx.globalAlpha = .6 * clamp((t - 7.3) / .4) * (.5 + .5 * Math.sin(t * 6 + i));
      circle(pp[0] + Math.cos(ang) * r, pp[1] - 40 + Math.sin(ang) * r * .6, 4, '#fff3b0'); ctx.restore();
    }
  }

  // vignette
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const v = ctx.createRadialGradient(960, 560, 500, 960, 560, 1150);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(40,10,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  captions(t);

  // fades
  const f = Math.max(1 - clamp(t / .5), clamp((t - 9.5) / .5));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
}
window.draw = draw;
draw(5);
</script>
</body></html>
